<!DOCTYPE html>
<html>
<head>
    <title>Student Exam Score Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f3f3f3;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    text-align: center;
    width: 400px;
}

input {
    padding: 10px;
    width: 80%;
    margin: 10px 0;
}

button {
    padding: 10px 20px;
    background-color: #0078d7;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.result {
    margin-top: 15px;
    font-size: 18px;
    color: green;
}
</style>
<body>
    <div class="container">
        <h1>🎓 Student Exam Score Predictor</h1>
        <form action="/predict" method="POST">
            <label for="Hours">Enter Study Hours:</label>
            <input type="text" name="Hours" id="Hours" required>
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <p class="result">{{ prediction }}</p>
        {% endif %}
    </div>
</body>
</html>
